plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

group = project.findProperty("mod_group_id")
version = project.findProperty("mod_version")

base {
    archivesName = project.findProperty("mod_id")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                safegecko {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
minecraft 'net.minecraftforge:forge:1.21.1-47.1.3'
}

tasks.named('jar').configure {
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}