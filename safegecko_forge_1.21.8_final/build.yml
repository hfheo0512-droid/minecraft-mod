name: Build safegecko

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Gradle 권한 설정
        run: |
          chmod +x gradlew
          dos2unix gradlew

      - name: 빌드 실행
        run: ./gradlew clean build --stacktrace

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: safegecko
          path: build/libs/*.jar
