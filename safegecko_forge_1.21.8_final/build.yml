name: Build Forge Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 권한 설정
        run: chmod +x gradlew

      - name: 빌드 실행
        run: ./gradlew build

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
